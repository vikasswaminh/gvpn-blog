<svg viewBox="0 0 700 260" width="100%" height="auto" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Architecture diagram showing out-of-band Control Plane managing identities and sockets over gRPC TLS while Node A and Node B exchange direct ChaCha20-Poly1305 UDP packets in kernel space." style="max-width: 680px; margin: 0 auto; display: block;">
    <!-- Control Plane Box -->
    <rect x="150" y="10" width="400" height="70" rx="8" fill="#0b1220" stroke="#7c3aed" stroke-width="2" />
    <text x="350" y="36" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">CONTROL PLANE (Out-of-Band SaaS)</text>
    <text x="350" y="56" fill="#cbd5e1" font-size="11" text-anchor="middle">Identity · Auth · STUN Socket Correlation · Policy Matrix</text>
    
    <!-- Control Channels -->
    <path d="M 260 80 L 160 140" stroke="#0958d9" stroke-width="2" stroke-dasharray="4" />
    <path d="M 440 80 L 540 140" stroke="#0958d9" stroke-width="2" stroke-dasharray="4" />
    <text x="180" y="105" fill="#0958d9" font-size="10" font-weight="bold">gRPC / TLS Control</text>
    <text x="520" y="105" fill="#0958d9" font-size="10" font-weight="bold">gRPC / TLS Control</text>
    
    <!-- Node A Box -->
    <rect x="50" y="145" width="200" height="80" rx="8" fill="#ffffff" stroke="#0958d9" stroke-width="2" />
    <text x="150" y="172" fill="#0f172a" font-size="14" font-weight="bold" text-anchor="middle">NODE A (Branch Edge)</text>
    <text x="150" y="192" fill="#475569" font-size="11" text-anchor="middle">Kernel wg0 · Local Routing</text>
    <text x="150" y="210" fill="#c2410c" font-size="10" font-weight="bold" text-anchor="middle">100.64.0.2/32</text>
    
    <!-- Node B Box -->
    <rect x="450" y="145" width="200" height="80" rx="8" fill="#ffffff" stroke="#0958d9" stroke-width="2" />
    <text x="550" y="172" fill="#0f172a" font-size="14" font-weight="bold" text-anchor="middle">NODE B (Cloud VPC)</text>
    <text x="550" y="192" fill="#475569" font-size="11" text-anchor="middle">Kernel wg0 · Local Routing</text>
    <text x="550" y="210" fill="#c2410c" font-size="10" font-weight="bold" text-anchor="middle">100.64.0.3/32</text>
    
    <!-- Direct Data Plane Arrow -->
    <path d="M 255 185 L 445 185" stroke="#16a34a" stroke-width="3" />
    <polygon points="255,180 245,185 255,190" fill="#16a34a" />
    <polygon points="445,180 455,185 445,190" fill="#16a34a" />
    <text x="350" y="168" fill="#15803d" font-size="11" font-weight="bold" text-anchor="middle">DIRECT DATA PLANE MESH</text>
    <text x="350" y="208" fill="#475569" font-size="10" text-anchor="middle">Line-Rate In-Kernel UDP · ChaCha20-Poly1305</text>
  </svg>